<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes | Vortex Sync</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/vtx.css') }}">
</head>
<body>
  <div class="app">
    {% set nav_ativo = 'clientes' %}
    {% include '_sidebar.html' %}

    <main class="main page-narrow">
      <header class="page-head">
        <div>
          <h1>Clientes</h1>
          <p>Cadastro de clientes do sistema.</p>
        </div>
      </header>

      <div class="split">
        <section class="panel">
          <div class="panel-head"><h2>Novo cliente</h2></div>
          <form method="post" class="panel-body form-stack">
            <div class="field">
              <label for="nome">Nome do cliente</label>
              <input id="nome" name="nome" type="text" class="input" placeholder="Nome do cliente" required>
            </div>
            <div><button class="btn btn-primary" type="submit">Salvar cliente</button></div>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Clientes cadastrados</h2>
            <span class="badge neutral-state">{{ clientes|length }}</span>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>Nome</th></tr>
              </thead>
              <tbody>
                {% for cliente in clientes %}
                <tr><td>{{ cliente.nome }}</td></tr>
                {% else %}
                <tr><td class="empty-cell">Nenhum cliente cadastrado.</td></tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
