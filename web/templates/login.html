<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Vortex Sync</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/vtx.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pg_login.css') }}">
</head>
<body class="page-login">

  <button id="themeToggle" class="btn btn-ghost btn-sm btn-icon login-theme" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
  </button>

  <main class="login-wrap">
    <div class="login-brand">
      <div class="brand-name">Vortex <span>Sync</span></div>
      <div class="brand-sub">Processamento de ordens de compra</div>
    </div>

    <section class="panel login-panel">
      <div class="panel-body">
        <h1 class="login-title">Entrar</h1>
        <p class="login-lead">Use seu usuário e senha de acesso.</p>

        {% if erro %}
          <div class="alert alert-err login-erro" role="alert">{{ erro }}</div>
        {% endif %}

        <form method="post" class="form-stack">
          <div class="field">
            <label for="user">Usuário</label>
            <input id="user" name="user" type="text" class="input login-input" placeholder="Digite seu usuário" required autocomplete="username" autofocus>
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" class="input login-input" placeholder="Digite sua senha" required autocomplete="current-password">
          </div>

          <button class="btn btn-primary login-submit" type="submit">Entrar</button>
        </form>
      </div>
    </section>

    <div class="login-foot">Vortex Sync · v1.0</div>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
